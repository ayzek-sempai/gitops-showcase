<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>CI/CD Demo</title>
</head>
<body>
  <h1>CI/CD Demo App</h1>
  <pre id="output">Loading...</pre>

  <script>
    fetch("/api/health")
      .then(res => res.json())
      .then(data => {
        document.getElementById("output").textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("output").textContent = err.toString();
      });
  </script>
</body>
</html>
